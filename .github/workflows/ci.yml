name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Render UI snapshots
        timeout-minutes: 5
        run: |
          swift run RenderSnapshot snapshots
          for f in snapshots/*.png; do
            echo "SNAPSHOT-BEGIN $(basename "$f")"
            base64 -b 76 -i "$f"
            echo "SNAPSHOT-END"
          done
      - name: Print compact snapshot previews
        # One JPEG per log line, so the whole set fits in the end of the log.
        run: |
          mkdir -p previews
          for f in snapshots/*.png; do
            out="previews/$(basename "${f%.png}").jpg"
            sips -s format jpeg -s formatOptions 70 -Z 1400 "$f" --out "$out" >/dev/null
            echo "PREVIEW $(basename "$out") $(base64 -i "$out" | tr -d '\n')"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: snapshots/*.png

  package-app:
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the .app
        run: tools/package/package-app.sh dist 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: AcousticStudioTools-app
          path: dist/*.zip
